# Data-catalog contribution stub (asset-catalog program).
#
# On every merge to main, prophet-mesh refreshes its OWN contribution shard in
# SocioProphet/prophet-core-catalog — Lord Michael's "each repo updates its
# contribution on merge to main" directive. This is the first real end-to-end
# consumer of the reusable workflow in git-ops-standards.
#
# Estate policy: secrets are MINTED IN CI, never PATs. The reusable workflow no
# longer takes a pre-minted token; it MINTS a short-lived GitHub App installation
# token in CI (scoped to prophet-core-catalog only) from the two org secrets of
# the `socioprophet-catalog-contributor` App: CATALOG_APP_ID +
# CATALOG_APP_PRIVATE_KEY. This stub forwards those secrets. Until BOTH are set
# the reusable workflow detects the missing credentials and no-ops, so this is
# safe to merge ahead of the App.

name: catalog-contribute

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contribute:
    # Pinned to the branch tip of git-ops-standards' catalog-token-mint change
    # (feat/catalog-token-mint). RE-PIN to the post-merge commit SHA on main once
    # that PR lands so a mutable branch can't change what runs here.
    uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@f96c1e622b6e47c8729a10f17094fb95637f64ff # feat/catalog-token-mint (re-pin to main SHA post-merge)
    # Forward the App credentials so the reusable workflow can mint the catalog
    # token in CI. `inherit` passes all org secrets; the reusable workflow only
    # reads CATALOG_APP_ID / CATALOG_APP_PRIVATE_KEY.
    secrets: inherit
